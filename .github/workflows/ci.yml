name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 插件没有运行时依赖，测试也不需要装依赖（用的都是 node 内置模块）。
      - name: Syntax check
        shell: bash
        run: |
          for f in lib/*.js; do
            node --check "$f"
          done

      - name: Offline test suites
        shell: bash
        run: |
          node test/smoke.mjs
          node test/killswitch-smoke.mjs
          node test/host-contract.mjs
          node test/job-smoke.mjs
          node test/reviewer-smoke.mjs
          node test/bridge-smoke.mjs
          node test/client-smoke.mjs

      # 打包体检（批 3）：`npm pack --dry-run` 到底会把什么发到社区 —— 版本三处一致 / 必需文件在 /
      # 活配置、日志、测试、内部计划与自评不在 / README（中英）里链到的 docs 引用打得开。
      # 这一条与「代码对不对」无关，但它直接决定陌生人 `dsh plugin add github:…` 装到的是个什么东西。
      - name: Pack audit (npm pack --dry-run)
        shell: bash
        run: npm run test:pack

      # cordis-inject 需要 DSH 自带的 cordis（asar 里取不出来，仓库不 vendor 它）。
      # 以前这里容忍 exit 2 = 「跳过」，等于这套回归在 CI 上从没跑过（S6/D3 的缺口）。
      # 现在临时装一份上游 cordis + cosmokit（--no-save：不进 package.json、不进 lock），
      # 测试自己就能在仓库的 node_modules 里发现它；exit 2 不再被容忍，跳过就是失败。
      - name: Cordis injection regression (real cordis, installed transiently)
        shell: bash
        run: |
          npm install --no-save --no-package-lock @deepseek-ai/cordis@^4 @deepseek-ai/cosmokit@^1
          OCR_TEST_CORDIS="$(node -e "console.log(require.resolve('@deepseek-ai/cordis'))")" node test/cordis-inject.mjs
